<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hệ Thống Quản Lý Sinh Viên | AdminLTE 4</title>

    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- AdminLTE 4 CSS (Overlaid on Bootstrap 5) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/css/adminlte.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <!-- Header / Navbar -->
        <nav class="app-header navbar navbar-expand bg-body shadow-sm">
            <div class="container-fluid">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a>
                    </li>
                    <li class="nav-item d-none d-md-block">
                        <span class="navbar-brand fw-bold text-primary mb-0">HỆ THỐNG ĐÀO TẠO</span>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Sidebar -->
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
            <div class="sidebar-brand">
                <a href="#" class="brand-link">
                    <span class="brand-text fw-light"><i class="bi bi-mortarboard-fill me-2"></i>AdminLTE v4</span>
                </a>
            </div>
            <div class="sidebar-wrapper">
                <nav class="mt-2">
                    <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu">
                        <li class="nav-item">
                            <a href="#" class="nav-link active">
                                <i class="nav-icon bi bi-people-fill"></i>
                                <p>Quản Lý Sinh Viên</p>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Content Header -->
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <h3 class="mb-0 text-dark fw-bold">Quản Lý Sinh Viên</h3>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-end">
                                <li class="breadcrumb-item"><a href="#">Trang chủ</a></li>
                                <li class="breadcrumb-item active">Sinh viên</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Body -->
            <div class="app-content">
                <div class="container-fluid">
                    
                    <!-- Form Input Card -->
                    <div class="card card-primary card-outline mb-4">
                        <div class="card-header">
                            <h5 class="card-title fw-bold mb-0" id="formTitle"><i class="bi bi-person-plus-fill me-2"></i>Thêm Mới Sinh Viên</h5>
                        </div>
                        <div class="card-body">
                            <input type="hidden" id="studentId">
                            <div class="row g-3">
                                <div class="col-md-2">
                                    <label class="form-label fw-semibold">Mã SV</label>
                                    <input type="text" class="form-control" id="studentCode" placeholder="SV001">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Họ và Tên</label>
                                    <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">Email</label>
                                    <input type="email" class="form-control" id="email" placeholder="example@gmail.com">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-semibold">Số điện thoại</label>
                                    <input type="text" class="form-control" id="phone" placeholder="0901234567">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-semibold">Lớp học</label>
                                    <input type="text" class="form-control" id="className" placeholder="C2024A">
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent d-flex gap-2">
                            <button class="btn btn-success" id="btnAdd" onclick="createStudent()">
                                <i class="bi bi-check-circle me-1"></i> Lưu Sinh Viên
                            </button>
                            <button class="btn btn-warning d-none" id="btnUpdate" onclick="updateStudent()">
                                <i class="bi bi-arrow-clockwise me-1"></i> Cập Nhật
                            </button>
                            <button class="btn btn-secondary" onclick="resetForm()">
                                <i class="bi bi-x-circle me-1"></i> Làm Mới
                            </button>
                        </div>
                    </div>

                    <!-- Table List Card -->
                    <div class="card card-outline card-info">
                        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                            <h5 class="card-title fw-bold mb-0"><i class="bi bi-table me-2"></i>Danh Sách Sinh Viên</h5>
                            
                            <!-- Tìm kiếm -->
                            <div class="input-group" style="max-width: 380px;">
                                <input type="text" class="form-control" id="searchKeyword" placeholder="Nhập tên sinh viên...">
                                <button class="btn btn-info text-white" onclick="searchStudent()">
                                    <i class="bi bi-search"></i> Tìm
                                </button>
                                <button class="btn btn-secondary" onclick="loadStudents()">
                                    <i class="bi bi-arrow-repeat"></i> Tất cả
                                </button>
                            </div>
                        </div>
                        <div class="card-body p-0 table-responsive">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead class="table-primary">
                                    <tr>
                                        <th style="width: 60px;">STT</th>
                                        <th>Mã SV</th>
                                        <th>Họ và Tên</th>
                                        <th>Email</th>
                                        <th>SĐT</th>
                                        <th>Lớp</th>
                                        <th style="width: 140px;" class="text-center">Thao Tác</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody"></tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer class="app-footer text-center py-3 text-muted">
            <small>Student Management System - Powered by <strong>AdminLTE.io (v4)</strong></small>
        </footer>
    </div>

    <!-- Bootstrap 5 & AdminLTE 4 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta2/dist/js/adminlte.min.js"></script>

    <script>
        function loadStudents() {
            fetch('/api/students')
                .then(res => res.json())
                .then(data => renderTable(data))
                .catch(err => console.error("Lỗi:", err));
        }

        function renderTable(data) {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            if (!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Chưa có dữ liệu sinh viên</td></tr>`;
                return;
            }

            data.forEach((s, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${idx + 1}</td>
                    <td><span class="badge text-bg-primary">${s.studentCode || s.student_code || ''}</span></td>
                    <td class="fw-semibold">${s.fullName || s.full_name || ''}</td>
                    <td>${s.email || ''}</td>
                    <td>${s.phone || ''}</td>
                    <td><span class="badge text-bg-info">${s.className || s.class_name || ''}</span></td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-warning me-1" title="Sửa" onclick="editRow('${s.id}', '${s.studentCode || s.student_code || ''}', '${s.fullName || s.full_name || ''}', '${s.email || ''}', '${s.phone || ''}', '${s.className || s.class_name || ''}')">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" title="Xóa" onclick="deleteStudent('${s.id}')">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function createStudent() {
            const payload = {
                studentCode: document.getElementById('studentCode').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                className: document.getElementById('className').value
            };
            if(!payload.studentCode || !payload.fullName) {
                alert("Vui lòng nhập Mã SV và Họ tên!");
                return;
            }
            fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => { loadStudents(); resetForm(); });
        }

        function deleteStudent(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sinh viên này?')) {
                fetch(`/api/students/delete/${id}`, { method: 'POST' })
                    .then(() => loadStudents());
            }
        }

        function editRow(id, code, name, email, phone, cls) {
            document.getElementById('studentId').value = id;
            document.getElementById('studentCode').value = code;
            document.getElementById('fullName').value = name;
            document.getElementById('email').value = email;
            document.getElementById('phone').value = phone;
            document.getElementById('className').value = cls;

            document.getElementById('formTitle').innerHTML = '<i class="bi bi-pencil-square me-2"></i>Cập Nhật Thông Tin Sinh Viên';
            document.getElementById('btnAdd').classList.add('d-none');
            document.getElementById('btnUpdate').classList.remove('d-none');
        }

        function updateStudent() {
            const id = document.getElementById('studentId').value;
            const payload = {
                studentCode: document.getElementById('studentCode').value,
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                className: document.getElementById('className').value
            };
            fetch(`/api/students/update/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => { loadStudents(); resetForm(); });
        }

        function searchStudent() {
            const keyword = document.getElementById('searchKeyword').value;
            fetch(`/api/students/search?name=${encodeURIComponent(keyword)}`)
                .then(res => res.json())
                .then(data => renderTable(data));
        }

        function resetForm() {
            document.getElementById('studentId').value = '';
            document.getElementById('studentCode').value = '';
            document.getElementById('fullName').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('className').value = '';

            document.getElementById('formTitle').innerHTML = '<i class="bi bi-person-plus-fill me-2"></i>Thêm Mới Sinh Viên';
            document.getElementById('btnAdd').classList.remove('d-none');
            document.getElementById('btnUpdate').classList.add('d-none');
        }

        window.onload = loadStudents;
    </script>
</body>
</html>
